openapi: 3.1.0
info:
  title: Bookstore API
  version: 1.0.0
  description: |
    Book catalog and Author profile API. Authentication is not currently configured.
servers:
  - url: /api
security: []
paths:
  /books:
    get:
      operationId: ListBooks
      summary: List books with optional category and author filters.
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/AuthorId'
        - name: author
          in: query
          description: Legacy exact author-name filter.
          schema:
            type: string
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: CreateBook
      summary: Create a book.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: UpdateBook
      summary: Update book quantity and active state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '201':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /books/health:
    get:
      operationId: BookApiHealth
      summary: Check API and MongoDB availability.
      responses:
        '200':
          description: API is available
        '500':
          $ref: '#/components/responses/ServerError'
  /books/{id}:
    get:
      operationId: GetBookById
      summary: Get a book by ID.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /books/single:
    get:
      operationId: GetBookLegacy
      summary: Legacy lookup by ID, title, or author name.
      description: Use GET /api/books/{id} for ID lookups in new clients.
      parameters:
        - name: id
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: author
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /authors:
    get:
      operationId: ListAuthors
      summary: List Authors, excluding inactive profiles by default.
      parameters:
        - name: includeInactive
          in: query
          description: Include soft-deleted Authors when true.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching Authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: CreateAuthor
      summary: Create an Author profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /authors/{id}:
    get:
      operationId: GetAuthor
      summary: Get an Author by ID.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: includeInactive
          in: query
          description: Allow retrieval of an inactive Author when true.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: SoftDeleteAuthor
      summary: Soft-delete an Author without modifying linked Books.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Author deactivated; linked Books remain unchanged
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
    Category:
      name: category
      in: query
      schema:
        type: string
    AuthorId:
      name: authorId
      in: query
      description: MongoDB ObjectId exposed as a 24-character hexadecimal string.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemDetails'
    Conflict:
      description: Duplicate Author name
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemDetails'
    ServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemDetails'
  schemas:
    CreateAuthorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        biography:
          type: [string, "null"]
        website:
          type: [string, "null"]
          format: uri
        birthDate:
          type: [string, "null"]
          format: date
        nationality:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
    Author:
      allOf:
        - $ref: '#/components/schemas/CreateAuthorRequest'
        - type: object
          required: [id, name, biography, website, birthDate, nationality, email, active, createdAt, updatedAt]
          properties:
            id:
              type: string
              pattern: '^[0-9a-fA-F]{24}$'
            active:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    CreateBookRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        authorId:
          type: [string, "null"]
          pattern: '^[0-9a-fA-F]{24}$'
          description: Preferred stable Author reference.
        author:
          type: [string, "null"]
          description: Legacy author name; resolved to an Author for compatibility.
        categoryId:
          type: [string, "null"]
        quantity:
          type: integer
        description:
          type: [string, "null"]
        language:
          type: [string, "null"]
        active:
          type: boolean
          default: true
        inactiveDate:
          type: [string, "null"]
          format: date-time
        publisher:
          type: [string, "null"]
        publisherDate:
          type: [string, "null"]
          format: date-time
    UpdateBookRequest:
      type: object
      required: [id, quantity, active]
      properties:
        id:
          type: string
        quantity:
          type: integer
        active:
          type: boolean
    Book:
      type: object
      required: [id, title, authorId, author, categoryId, quantity, description, language, active, inactiveDate, publisher, publisherDate]
      properties:
        id:
          type: string
        title:
          type: [string, "null"]
        authorId:
          type: [string, "null"]
        author:
          type: [string, "null"]
        categoryId:
          type: integer
        quantity:
          type: integer
        description:
          type: [string, "null"]
        language:
          type: [string, "null"]
        active:
          type: boolean
        inactiveDate:
          type: [string, "null"]
          format: date-time
        publisher:
          type: [string, "null"]
        publisherDate:
          type: [string, "null"]
          format: date-time
    ApiProblemDetails:
      type: object
      required: [type, title, status, detail, instance, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Request trace identifier.
        traceId:
          type: string
